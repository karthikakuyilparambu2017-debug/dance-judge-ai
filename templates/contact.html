<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Dance Judge AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
            color: #333;
        }
        
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #444;
            margin-bottom: 20px;
        }

        .contact-info, .contact-form, .social-media, .map {
            background: #fff;
            padding: 30px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .contact-form input, 
        .contact-form textarea, 
        .contact-form button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .contact-form button {
            background: #4CAF50;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .contact-form button:hover {
            background: #45a049;
        }

        .social-media a {
            display: inline-block;
            margin: 10px;
            text-decoration: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .social-media a.facebook { background: #3b5998; }
        .social-media a.twitter { background: #1da1f2; }
        .social-media a.instagram { background: #e4405f; }
        .social-media a:hover { opacity: 0.8; }

        iframe {
            width: 100%;
            height: 350px;
            border: 0;
            border-radius: 8px;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin: 20px 0;
            padding: 10px 25px;
            background: #f04e30;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #ff7f50;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ✅ Company Info -->
    <div class="contact-info">
        <h1>Contact Us</h1>
        <p><strong>Email:</strong> support@dancejudgeai.com</p>
        <p><strong>Phone:</strong> +1 800 123 4567</p>
        <p><strong>Address:</strong> 123 AI Street, Tech City, USA</p>
    </div>

    <!-- ✅ Contact Form -->
    <div class="contact-form">
        <h2>Send Us a Message</h2>
        <form action="/submit_contact" method="POST">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" placeholder="Your Message" rows="6" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>

    <!-- ✅ Social Media Links -->
    <div class="social-media">
        <h2>Connect With Us</h2>
        <a href="https://facebook.com" target="_blank" class="facebook">Facebook</a>
        <a href="https://twitter.com" target="_blank" class="twitter">Twitter</a>
        <a href="https://instagram.com" target="_blank" class="instagram">Instagram</a>
    </div>

    <!-- ✅ Embedded Google Map -->
    <div class="map">
        <h2>Our Location</h2>
        <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3919.150792086548!2d106.71258547436784!3d10.800405758548469!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31752928a5e6a9e3%3A0x9dbcd7a9c0e55e!2sBitexco%20Financial%20Tower!5e0!3m2!1sen!2s!4v1711623408900" 
            allowfullscreen>
        </iframe>
    </div>

    <!-- ✅ Back to Home Button -->
    <a href="/home" class="back-btn">Back to Home</a>

</div>

</body>
</html>
