<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dance Judge AI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        h1 {
            text-align: center;
        }
        .container {
            width: 80%;
            margin: 0 auto;
        }
        .upload-form {
            text-align: center;
            margin-bottom: 30px;
        }
        video {
            width: 100%;
            max-height: 500px;
            border: 2px solid #ccc;
            border-radius: 5px;
            margin: 20px 0;
            display: none;  /* ✅ Initially hidden */
        }
        .scores {
            margin-top: 20px;
            font-size: 18px;
        }
        .score {
            margin: 10px 0;
            padding: 10px;
            background: #e1f5fe;
            border-left: 5px solid #2196F3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Dance Judge AI</h1>

    <!-- ✅ Upload Form -->
    <div class="upload-form">
        <form id="upload-form" enctype="multipart/form-data">
            <input type="file" name="video" id="video" required>
            <button type="submit">Upload</button>
        </form>
    </div>

    <!-- ✅ Video Section -->
    <video id="video-player" controls></video>

    <!-- ✅ Real-time Score Section -->
    <div id="score-container" class="scores">
        <h2>Real-time Scores:</h2>
        <div id="scores"></div>
    </div>
</div>

<script>
    const form = document.getElementById('upload-form');
    const videoPlayer = document.getElementById('video-player');
    const scoreContainer = document.getElementById('score-container');
    const scoresDiv = document.getElementById('scores');

    const socket = io();

    // ✅ Handle video upload
    form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const formData = new FormData(form);

        const response = await fetch('/upload', {
            method: 'POST',
            body: formData
        });

        if (response.ok) {
            const data = await response.json();
            
            // ✅ Display the uploaded video
            videoPlayer.src = data.video_url;
            videoPlayer.style.display = 'block';   // Show the video
            videoPlayer.play();

            // ✅ Clear previous scores
            scoresDiv.innerHTML = '';
        } else {
            alert('Error uploading video.');
        }
    });

    // ✅ Listen for real-time score updates
    socket.on('score_update', (data) => {
        const scoreMessage = document.createElement('div');
        scoreMessage.classList.add('score');
        scoreMessage.textContent = data.message;
        scoresDiv.appendChild(scoreMessage);
    });

    // ✅ Handle backend errors
    socket.on('error', (data) => {
        alert(`Error: ${data.error}`);
    });
</script>

</body>
</html>
